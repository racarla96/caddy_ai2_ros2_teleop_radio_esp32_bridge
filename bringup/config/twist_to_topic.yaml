twist_to_topics_node:
  ros__parameters:
    input_topic: "cmd_vel"
    steering_topic: "steering_angle"
    velocity_topic: "velocity"
    max_steering_angle: 0.52  # ~30 grados en radianes
    max_velocity: 2.0  # m/s
    wheelbase: 1.0  # Distancia entre ejes en metros
    use_ackermann_conversion: true  # Convertir angular.z a steering angle usando geometría Ackermann